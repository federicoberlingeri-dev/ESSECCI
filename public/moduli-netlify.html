<!doctype html>
<!--
  "Sagome" dei moduli per Netlify Forms (non linkate nel sito).
  Netlify legge questo file al deploy e registra i 3 moduli con i rispettivi campi.
  Ogni modulo = una destinazione: nel pannello Netlify (Forms → Notifications) associare a ciascuno l'email corretta.
  Se si aggiunge un campo al modulo del sito, aggiungerlo anche qui.
-->
<html lang="it"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Moduli</title></head>
<body>
<form name="contatti-formigine" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input name="bot-field"><input name="negozio"><input name="esigenza"><input name="promo"><input name="pagina">
  <input name="fornitura"><input type="file" name="bolletta"><input name="data_preferita"><input name="fascia_oraria">
  <input name="azienda"><input name="settore"><input name="citta_azienda">
  <input name="nome"><input name="telefono"><input name="email"><textarea name="messaggio"></textarea><input name="privacy">
</form>
<form name="contatti-maranello" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input name="bot-field"><input name="negozio"><input name="esigenza"><input name="promo"><input name="pagina">
  <input name="fornitura"><input type="file" name="bolletta"><input name="data_preferita"><input name="fascia_oraria">
  <input name="azienda"><input name="settore"><input name="citta_azienda">
  <input name="nome"><input name="telefono"><input name="email"><textarea name="messaggio"></textarea><input name="privacy">
</form>
<form name="contatti-drive2store" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden>
  <input name="bot-field"><input name="negozio"><input name="esigenza"><input name="promo"><input name="pagina">
  <input name="fornitura"><input type="file" name="bolletta"><input name="data_preferita"><input name="fascia_oraria">
  <input name="azienda"><input name="settore"><input name="citta_azienda">
  <input name="nome"><input name="telefono"><input name="email"><textarea name="messaggio"></textarea><input name="privacy">
</form>
</body></html>
